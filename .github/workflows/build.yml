name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/DragShift.app DragShift.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DragShift
          path: DragShift.zip
