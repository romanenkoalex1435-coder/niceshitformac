name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (macOS 26 SDK enables Liquid Glass)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/DragShift.app DragShift.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DragShift
          path: DragShift.zip
